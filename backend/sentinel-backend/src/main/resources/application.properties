# ============================================================
# APPLICATION PROPERTIES
# Purpose: Configure Spring Boot backend application
# ============================================================

# ==============================
# SERVER CONFIGURATION
# ==============================
# Port for backend server (frontend connects to this)
server.port=8080

# ==============================
# MySQL DATABASE CONFIGURATION
# ==============================
# Database connection URL
# - localhost: MySQL server location
# - 3306: Default MySQL port
# - sentinel_factory: Database name
spring.datasource.url=jdbc:mysql://localhost:3306/sentinel_factory

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=root

# MySQL JDBC driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / HIBERNATE CONFIGURATION
# ==============================
# Auto-update database schema based on entities
# Options: create, create-drop, update, validate, none
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (for debugging)
spring.jpa.show-sql=true

# Format SQL queries for readability
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JACKSON JSON CONFIGURATION
# ==============================
# CRITICAL FIX: Maps snake_case JSON to camelCase Java fields
# Example: "picture_url" in JSON → "pictureUrl" in Java
# Example: "person_id" in JSON → "personId" in Java
# Example: "zone_name" in JSON → "zoneName" in Java
# This ensures picture_url from Vision system maps correctly to picture field
spring.jackson.property-naming-strategy=SNAKE_CASE

# ==============================
# CORS CONFIGURATION
# ==============================
# Allow frontend to access API from any origin
# Change * to specific frontend URL in production
spring.web.cors.allowed-origins=*

# Allowed HTTP methods
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Allowed headers
spring.web.cors.allowed-headers=*

# Allow credentials (cookies, authorization headers)
spring.web.cors.allow-credentials=true

# Max age for CORS preflight cache (in seconds)
spring.web.cors.max-age=3600

# ==============================
# MQTT CONFIGURATION
# ==============================
# MQTT broker URL (for Vision system communication)
spring.mqtt.broker-url=tcp://localhost:1883

# Unique client ID for this backend
spring.mqtt.client-id=sentinel-backend

# Default topic to subscribe/publish
spring.mqtt.default-topic=detection/events